name: Build and boot

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm grub-pc-bin grub-common xorriso mtools qemu-system-x86

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --target x86_64-unknown-none

      - name: Check formatting
        run: cd kernel && cargo fmt --check

      - name: Clippy
        run: cd kernel && cargo clippy --release -- -D warnings

      - name: Build ISO
        run: make

      - name: Boot test
        run: make test
