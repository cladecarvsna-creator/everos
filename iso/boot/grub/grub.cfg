# The installation disc. It starts the installer, which can also run
# EverOS without installing it. The installer copies the kernel and GRUB's
# own files (the modules below) to the hard disk.
set timeout=0
set default=0

# video drivers, so GRUB can set the framebuffer mode the kernel asks for
insmod all_video

# A disk with EverOS already installed starts by default after a few
# seconds; the installer is still one key press away.
insmod part_msdos
insmod fat
if search --no-floppy --file --set=installed /EverOS/install.cfg; then
    set default=1
    set timeout=5
fi

menuentry "Install EverOS" {
    multiboot2 /boot/kernel.bin setup
    module2 /boot/kernel.bin kernel.bin
    module2 /boot/install/boot.img boot.img
    module2 /boot/install/core.img core.img
    boot
}

if [ -n "$installed" ]; then
    menuentry "Start EverOS from the hard disk" {
        set root=$installed
        multiboot2 /boot/kernel.bin
        boot
    }
fi
